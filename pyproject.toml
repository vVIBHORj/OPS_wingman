[project]
name = "opswingman"
version = "0.1.0"
description = "Intelligent Operations Platform for Modern Businesses (Local-first & Deterministic Controls)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "OpsWingman Team" }
]
dependencies = [
    "fastapi>=0.111.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.35.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "SQLAlchemy>=2.0.30,<2.1.0",
    "asyncpg>=0.29.0,<0.31.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "alembic>=1.13.0,<1.15.0",
    "pgvector>=0.2.5,<0.4.0",
    "langgraph>=0.1.0,<0.3.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "numpy>=1.26.0,<2.1.0",
    "redis>=5.0.4,<6.0.0",
    "httpx>=0.27.0,<0.29.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "opentelemetry-api>=1.24.0,<2.0.0",
    "opentelemetry-sdk>=1.24.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0,<1.0.0",
    "langfuse>=2.30.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.6,<0.25.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.4,<0.7.0",
]

[tool.pyright]
include = [
    "backend",
    "simulator",
    "database",
    "integrations",
    "workers",
    "tests",
    "scripts",
    "evals"
]
extraPaths = [
    "."
]
pythonVersion = "3.12"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
