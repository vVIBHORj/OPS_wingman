[project]
name = "opswingman"
version = "0.1.0"
description = "Intelligent Operations Platform for Modern Businesses (Local-first & Deterministic Controls)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "OpsWingman Team" }
]

[tool.pyright]
include = [
    "backend",
    "simulator",
    "database",
    "integrations",
    "workers",
    "tests",
    "scripts",
    "evals"
]
extraPaths = [
    "."
]
pythonVersion = "3.12"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
