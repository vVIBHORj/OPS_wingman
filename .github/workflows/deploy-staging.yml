name: Staging Deployment

"on":
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional container image tag override (defaults to Git SHA)'
        required: false
        type: string
        default: ''
      build_image:
        description: 'Build and push container image before deploying'
        required: false
        type: boolean
        default: true
      skip_migrations:
        description: 'Skip running database schema migrations before rollout'
        required: false
        type: boolean
        default: false

concurrency:
  group: staging-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-staging-image:
    name: Build & Push Staging Image
    runs-on: ubuntu-latest
    outputs:
      target_image: ${{ steps.image-meta.outputs.target_image }}
      immutable_tag: ${{ steps.image-meta.outputs.immutable_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Staging Image Tag
        id: image-meta
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          REGISTRY_VAR: ${{ vars.REGISTRY }}
          IMAGE_NAME_VAR: ${{ vars.IMAGE_NAME }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          REGISTRY="${REGISTRY_VAR:-ghcr.io}"
          IMAGE_NAME="${IMAGE_NAME_VAR:-${GITHUB_REPOSITORY}}"
          IMAGE_BASE="${REGISTRY}/${IMAGE_NAME}"
          IMAGE_BASE=$(echo "${IMAGE_BASE}" | tr '[:upper:]' '[:lower:]')

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMMUTABLE_TAG="sha-${SHORT_SHA}"

          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            SELECTED_TAG="${INPUT_IMAGE_TAG}"
          else
            SELECTED_TAG="${IMMUTABLE_TAG}"
          fi

          if [[ "${SELECTED_TAG}" == *"/"* ]] || [[ "${SELECTED_TAG}" == *":"* ]]; then
            TARGET_IMAGE="${SELECTED_TAG}"
          else
            TARGET_IMAGE="${IMAGE_BASE}:${SELECTED_TAG}"
          fi

          echo "target_image=${TARGET_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=${IMMUTABLE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: inputs.build_image != false
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and Push Staging Image
        if: inputs.build_image != false
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: ${{ secrets.REGISTRY_PASSWORD != '' || vars.REGISTRY == 'ghcr.io' || vars.REGISTRY == '' }}
          tags: ${{ steps.image-meta.outputs.target_image }}
          labels: |
            org.opencontainers.image.title=OpsWingman Backend (Staging)
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-staging:
    name: Deploy to Kubernetes Staging
    needs: build-staging-image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubeconfig
        id: kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_STAGING || secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBECONFIG_DATA" ]; then
            mkdir -p "$HOME/.kube"
            printf '%s\n' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "No kubeconfig secret provided; skipping cluster deployment steps."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Staging Kustomize Image Override
        env:
          TARGET_IMAGE: ${{ needs.build-staging-image.outputs.target_image }}
        run: |
          echo "Configuring staging overlay with target image: ${TARGET_IMAGE}"
          python -c "
          import os, yaml
          target = os.environ['TARGET_IMAGE']
          with open('deploy/kubernetes/overlays/staging/kustomization.yaml') as f:
              k = yaml.safe_load(f)
          if ':' in target:
              repo, tag = target.rsplit(':', 1)
          else:
              repo, tag = target, 'latest'
          images = k.setdefault('images', [])
          target_entry = next((img for img in images if img.get('name') == 'opswingman/backend'), None)
          if target_entry is None:
              target_entry = {'name': 'opswingman/backend'}
              images.append(target_entry)
          target_entry['newName'] = repo
          target_entry['newTag'] = tag
          with open('deploy/kubernetes/overlays/staging/kustomization.yaml', 'w') as f:
              yaml.dump(k, f, sort_keys=False)
          "

      - name: Validate Staging Manifests via Dry Run
        run: |
          kubectl kustomize deploy/kubernetes/overlays/staging/ > /dev/null
          echo "Staging Kustomize overlay rendered successfully."

      - name: Apply Staging Schema Migrations (Controlled Job with Same Image)
        if: steps.kubeconfig.outputs.configured == 'true' && inputs.skip_migrations != true
        env:
          TARGET_IMAGE: ${{ needs.build-staging-image.outputs.target_image }}
        run: |
          echo "Triggering database schema migration job in namespace opswingman-staging using image ${TARGET_IMAGE}..."
          kubectl delete job opswingman-db-migrate -n opswingman-staging --ignore-not-found
          python -c "
          import os, yaml
          target = os.environ['TARGET_IMAGE']
          with open('deploy/kubernetes/migration-job.yaml') as f:
              j = yaml.safe_load(f)
          j['spec']['template']['spec']['containers'][0]['image'] = target
          with open('deploy/kubernetes/migration-job.yaml', 'w') as f:
              yaml.dump(j, f, sort_keys=False)
          "
          kubectl apply -f deploy/kubernetes/migration-job.yaml -n opswingman-staging
          if kubectl wait --for=condition=complete job/opswingman-db-migrate -n opswingman-staging --timeout=180s; then
            echo "Database migration completed successfully."
          else
            echo "ERROR: Database migration failed. Inspecting logs:"
            kubectl logs -n opswingman-staging -l app.kubernetes.io/name=opswingman-db-migrate --tail=100
            exit 1
          fi

      - name: Deploy Staging Overlay
        if: steps.kubeconfig.outputs.configured == 'true'
        run: |
          kubectl apply -k deploy/kubernetes/overlays/staging/

      - name: Verify Staging Rollout Status
        if: steps.kubeconfig.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/opswingman-backend -n opswingman-staging --timeout=300s
          kubectl get deployment opswingman-backend -n opswingman-staging
