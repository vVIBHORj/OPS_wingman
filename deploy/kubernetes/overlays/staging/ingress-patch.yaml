apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opswingman-backend-ingress
  namespace: opswingman
spec:
  ingressClassName: nginx
  rules:
    - host: api-staging.opswingman.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opswingman-backend-service
                port:
                  number: 8000
