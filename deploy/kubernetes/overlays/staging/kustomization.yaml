apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opswingman-staging

resources:
  - ../../base

images:
  - name: opswingman/backend
    newName: opswingman-backend
    newTag: staging-local

patches:
  - path: configmap-patch.yaml
  - path: ingress-patch.yaml
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: opswingman-backend-secrets
        namespace: opswingman
